[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "riskauth_ml"
version = "2.0.0"
description = "RiskAuth ML — 21-feature unsupervised risk scoring engine"
authors = [
    {name = "Nehan Wijayagunarathna", email = "nehannimsara0031029@gmail.com"},
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "joblib>=1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "black>=21.0",
    "flake8>=3.9",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["riskauth_ml*"]
